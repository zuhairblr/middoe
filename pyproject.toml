[tool.poetry]
name = "middoe"
version = "0.2.1"
description = "Model-based design of experiments (MBDoE), parameter estimation, uncertainty and model discrimination for dynamic (ODE) models in Python."
authors = ["Zuhair Tabrizi <zuhairtabrizi@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://middoe.readthedocs.io/en/latest/"
repository = "https://github.com/zuhairblr/middoe"
documentation = "https://middoe.readthedocs.io/en/latest/"
keywords = [
    "design of experiments", "model-based design of experiments", "MBDoE", "optimal experimental design",
    "parameter estimation", "model discrimination", "model identification", "uncertainty quantification",
    "Fisher information", "sensitivity analysis", "estimability analysis", "kinetic modelling",
    "chemical engineering", "process systems engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
numpy = "<=2.2.3"
scipy = "<=1.15.2"
matplotlib = "<=3.10.1"
pandas = "<=2.2.3"
pendulum = ">=3.0.0"
openpyxl = "^3.1.5"
pymoo = "^0.6.1.3"
XlsxWriter = "^3.2.3"
numdifftools = ">=0.9.41"


[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
mypy = "^1.15.0"
openpyxl = "^3.1.5"

[tool.poetry.urls]
"Tutorials" = "https://middoe.readthedocs.io/en/latest/tutorials.html"
"Changelog" = "https://middoe.readthedocs.io/en/latest/changelog.html"
"Paper" = "https://doi.org/10.1016/j.dche.2025.100276"
"Issues" = "https://github.com/zuhairblr/middoe/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
